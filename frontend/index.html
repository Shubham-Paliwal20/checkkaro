<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Parkho — Know Your Food & Cosmetic Products</title>
    <meta name="description" content="Search any Indian product to understand its ingredients — explained simply, no jargon, no confusion. Check food additives, cosmetic chemicals, FSSAI data and more." />
    <meta name="keywords" content="check product ingredients India, food ingredients checker, FSSAI product search, cosmetic ingredients India, food additives checker, what is in my food, ingredient analyser India, Parkho" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Parkho" />
    <link rel="canonical" href="https://checkkaro.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FF9933" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parkho" />
    <meta property="og:title" content="Parkho — Know Your Food & Cosmetic Products" />
    <meta property="og:description" content="Search any Indian product and understand every ingredient — explained simply, no jargon, no confusion." />
    <meta property="og:image" content="https://checkkaro.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://checkkaro.vercel.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Parkho — Know Your Food & Cosmetic Products" />
    <meta name="twitter:description" content="Search any Indian product and understand every ingredient — explained simply, no jargon, no confusion." />
    <meta name="twitter:image" content="https://checkkaro.vercel.app/og-image.png" />

    <!-- Structured Data: WebSite (enables Google Sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Parkho",
      "url": "https://checkkaro.vercel.app",
      "description": "Search any Indian product to understand its ingredients — explained simply, no jargon.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://checkkaro.vercel.app/result/{search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Parkho",
      "url": "https://checkkaro.vercel.app",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "inLanguage": "en-IN",
      "description": "Free tool to check ingredients in Indian food and cosmetic products. Search any product and get ingredient-by-ingredient breakdown with FSSAI regulatory context.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "featureList": [
        "Search 600+ Indian food and cosmetic products",
        "Ingredient-by-ingredient breakdown",
        "FSSAI regulatory data",
        "Awareness score for every product",
        "Check individual food additives and E-numbers"
      ]
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
