name: checkkaro
description: CheckKaro — Know what's inside your products
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0

  # Local cache
  hive_flutter: ^1.1.0

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # UI utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#ffffff"
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
    icon_background_color: "#ffffff"
